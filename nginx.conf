server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite writes content-hashed bundles here (index-A1B2C3.js), so a changed
  # file always arrives under a new name and can be cached forever.
  location /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Everything copied verbatim out of public/ keeps its name between deploys,
  # so it must be revalidated. Marking these immutable means a replaced photo
  # stays in visitors' browsers for a year.
  location /assets/images/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=3600, must-revalidate" always;
  }

  # The shell must never be cached, or a deploy ships new bundles that nobody
  # is told to fetch.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # The reset page reads a one-time token from the URL: never cache it and
  # never leak the URL to other sites through the Referer header.
  location = /reset-password {
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
